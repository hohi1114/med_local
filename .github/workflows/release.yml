name: Build & Release

on:
  push:
    tags:
      - "v*"   # v0.0.2 처럼 v로 시작하는 태그 푸시 시

# 👇 이게 핵심: Release 생성/업로드에 필요한 권한
permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 20
      - run: npm ci

      # (선택) 먼저 빈 Release 생성: electron-builder가 여기에 업로드함
      - name: Ensure GitHub Release exists
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 배포 빌드 + 자동 업로드
      - name: Build & publish mac artifacts
        run: npm run dist -- --mac dmg zip --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 20
      - run: npm ci

      # (선택) 빈 Release 보장 - 여러 job에서 호출해도 안전
      - name: Ensure GitHub Release exists
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & publish win artifacts
        run: npm run dist -- --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
