name: Build & Release

on:
  push:
    tags:
      - "v*"   # v0.0.x 형태의 태그 푸시 시 실행

permissions:
  contents: write

jobs:
  build-mac:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install deps
        run: npm ci || npm install --no-audit --no-fund

      # (옵션) 빈 릴리스 먼저 보장
      - name: Ensure GitHub Release exists
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Mac 빌드 + GitHub 업로드 시도
      - name: Build mac with electron-builder (publish)
        run: npm run dist -- --mac dmg zip --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 빌드 타임에 번들로 인라인된다. 없으면 앱이 localhost 를 바라본다.
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_NAVER_MAPS_CLIENT_ID: ${{ secrets.VITE_NAVER_MAPS_CLIENT_ID }}

      # 🔒 확실히 첨부: outputDir = release/
      - name: Upload mac artifacts to Release (fallback)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            release/**/*.dmg
            release/**/*.zip
            release/**/*.pkg
            release/**/*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-win:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install deps
        run: npm ci || npm install --no-audit --no-fund

      - name: Ensure GitHub Release exists
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build win with electron-builder (publish)
        run: npm run dist -- --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 빌드 타임에 번들로 인라인된다. 없으면 앱이 localhost 를 바라본다.
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_NAVER_MAPS_CLIENT_ID: ${{ secrets.VITE_NAVER_MAPS_CLIENT_ID }}

      # 🔒 확실히 첨부: outputDir = release/
      - name: Upload win artifacts to Release (fallback)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            release/**/*.exe
            release/**/*.msi
            release/**/*.zip
            release/**/*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
